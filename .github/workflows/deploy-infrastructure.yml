name: Deploy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: ['dev', 'staging', 'prod']

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Bicep
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Bicep templates
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: natya-theerth-${{ github.event.inputs.environment }}-rg
          template: infrastructure/main.bicep
          parameters: infrastructure/parameters.${{ github.event.inputs.environment }}.json adminPasswordHash=${{ secrets.ADMIN_PASSWORD_HASH }}
          deploymentMode: Validate

  deploy:
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    needs: validate
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: natya-theerth-${{ github.event.inputs.environment }}-rg
          template: infrastructure/main.bicep
          parameters: infrastructure/parameters.${{ github.event.inputs.environment }}.json adminPasswordHash=${{ secrets.ADMIN_PASSWORD_HASH }}
          deploymentName: natya-theerth-${{ github.run_number }}
