name: Deploy Azure Functions API

on:
  push:
    branches: [main]
    paths:
      - 'api-functions/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: ['dev', 'staging', 'prod']

env:
  NODE_VERSION: '18.x'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: api-functions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Azure Functions
    environment: ${{ github.event.inputs.environment || 'prod' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api-functions/package-lock.json

      - name: Install dependencies
        working-directory: api-functions
        run: npm ci

      - name: Build TypeScript
        working-directory: api-functions
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set function app name
        id: set-app-name
        run: |
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          echo "app_name=natyatheerth-${ENV}-functions" >> "$GITHUB_OUTPUT"

      - name: Check if Azure Function App exists
        id: check-app
        run: |
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          RG="natya-theerth-${ENV}-rg"
          if az functionapp show --name "${{ steps.set-app-name.outputs.app_name }}" --resource-group "$RG" --query id --output tsv 2>/dev/null; then
            echo "app_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_exists=false" >> "$GITHUB_OUTPUT"
            echo "Azure Function App '${{ steps.set-app-name.outputs.app_name }}' not found in resource group '${RG}'. Skipping deployment."
          fi

      - name: Deploy to Azure Functions
        if: steps.check-app.outputs.app_exists == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name:    ${{ steps.set-app-name.outputs.app_name }}
          package:     ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false
          respect-funcignore: true

      - name: Warn if Azure Function App does not exist
        if: steps.check-app.outputs.app_exists == 'false'
        run: |
          echo "::warning::Azure Function App '${{ steps.set-app-name.outputs.app_name }}' was not found. Deploy the infrastructure first using the 'deploy-infrastructure.yml' workflow, then re-run this deployment."
          exit 1
