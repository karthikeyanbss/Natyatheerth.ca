name: Deploy Azure Functions API

on:
  push:
    branches: [main]
    paths:
      - 'api-functions/**'
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  AZURE_FUNCTIONAPP_NAME: natya-theerth-prod-functions
  AZURE_FUNCTIONAPP_PACKAGE_PATH: api-functions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Azure Functions
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api-functions/package-lock.json

      - name: Install dependencies
        working-directory: api-functions
        run: npm ci

      - name: Build TypeScript
        working-directory: api-functions
        run: npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check if Azure Function App exists
        id: check-app
        run: |
          if az functionapp show --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" --query id --output tsv 2>/dev/null; then
            echo "app_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_exists=false" >> "$GITHUB_OUTPUT"
            echo "Azure Function App '${{ env.AZURE_FUNCTIONAPP_NAME }}' not found. Skipping deployment."
          fi

      - name: Deploy to Azure Functions
        if: steps.check-app.outputs.app_exists == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name:    ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package:     ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false
