name: Build Ionic Mobile App

on:
  push:
    branches: [main]
    paths:
      - 'mobile-ionic/**'
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  JAVA_VERSION: '17'

jobs:
  build-web:
    runs-on: ubuntu-latest
    name: Build Ionic Web Assets
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile-ionic/package-lock.json

      - name: Install dependencies
        working-directory: mobile-ionic
        run: npm ci

      - name: Build Ionic app
        working-directory: mobile-ionic
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ionic-web-build
          path: mobile-ionic/www/
          retention-days: 7

  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    needs: build-web
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile-ionic/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile-ionic
        run: npm ci

      - name: Build Ionic app
        working-directory: mobile-ionic
        run: npm run build

      - name: Sync Capacitor
        working-directory: mobile-ionic
        run: npx cap sync android

      - name: Build Android APK (debug)
        working-directory: mobile-ionic/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: natya-theerth-debug.apk
          path: mobile-ionic/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
