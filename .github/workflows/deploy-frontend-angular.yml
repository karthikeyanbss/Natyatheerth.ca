name: Deploy Angular Frontend

on:
  push:
    branches: [main, dev, staging]
    paths:
      - 'frontend-angular/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: ['dev', 'staging', 'prod']

env:
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Angular App
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'dev') || github.ref_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        working-directory: frontend-angular
        run: npm ci

      - name: Set build configuration
        id: set-config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="dev"
          else
            ENV="${{ github.ref_name }}"
          fi
          echo "env_name=${ENV}" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "prod" ]; then
            echo "ng_config=production" >> "$GITHUB_OUTPUT"
          else
            echo "ng_config=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Angular app
        working-directory: frontend-angular
        run: npx ng build --configuration ${{ steps.set-config.outputs.ng_config }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set SWA name and resource group
        id: set-app-name
        run: |
          ENV="${{ steps.set-config.outputs.env_name }}"
          echo "swa_name=natyatheerth-${ENV}-web" >> "$GITHUB_OUTPUT"
          echo "rg_name=natya-theerth-${ENV}-rg" >> "$GITHUB_OUTPUT"

      - name: Check if Azure Static Web App exists and fetch deployment token
        id: check-swa
        run: |
          SWA_NAME="${{ steps.set-app-name.outputs.swa_name }}"
          RG_NAME="${{ steps.set-app-name.outputs.rg_name }}"
          if az staticwebapp show --name "$SWA_NAME" --resource-group "$RG_NAME" --query id --output tsv 2>/dev/null; then
            echo "swa_exists=true" >> "$GITHUB_OUTPUT"
            TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RG_NAME" --query "properties.apiKey" -o tsv)
            echo "::add-mask::$TOKEN"
            echo "SWA_DEPLOYMENT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          else
            echo "swa_exists=false" >> "$GITHUB_OUTPUT"
            echo "Azure Static Web App '$SWA_NAME' not found in resource group '$RG_NAME'. Skipping deployment."
          fi

      - name: Deploy to Azure Static Web Apps
        if: steps.check-swa.outputs.swa_exists == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend-angular/dist/natya-theerth-web/browser'
          output_location: ''
          skip_app_build: true
