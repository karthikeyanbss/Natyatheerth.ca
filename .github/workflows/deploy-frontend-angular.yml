name: Deploy Angular Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend-angular/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: ['dev', 'staging', 'prod']

env:
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Angular App
    environment: ${{ github.event.inputs.environment || 'prod' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        working-directory: frontend-angular
        run: npm ci

      - name: Set build configuration
        id: set-config
        run: |
          ENV="${{ github.event.inputs.environment || 'prod' }}"
          if [ "$ENV" = "prod" ]; then
            echo "ng_config=production" >> "$GITHUB_OUTPUT"
          else
            echo "ng_config=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Angular app
        working-directory: frontend-angular
        run: npx ng build --configuration ${{ steps.set-config.outputs.ng_config }}

      - name: Deploy to Azure Static Web Apps
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        continue-on-error: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend-angular'
          output_location: 'dist/natya-theerth-web/browser'
          skip_app_build: true
