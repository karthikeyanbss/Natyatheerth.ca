<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep dark maroon gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0505;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#1A0A0A;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#2D0E0E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3D1515;stop-opacity:1"/>
    </linearGradient>

    <!-- Radial glow behind dancer -->
    <radialGradient id="glowGrad" cx="50%" cy="55%" r="40%">
      <stop offset="0%" style="stop-color:#8B1A1A;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#5C1010;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1A0A0A;stop-opacity:0"/>
    </radialGradient>

    <!-- Gold glow for lamps -->
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#D4AF37;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0"/>
    </radialGradient>

    <!-- Pattern for decorative tiles -->
    <pattern id="floorTile" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <line x1="0" y1="0" x2="40" y2="40" stroke="#D4AF37" stroke-width="0.3" stroke-opacity="0.15"/>
      <line x1="40" y1="0" x2="0" y2="40" stroke="#D4AF37" stroke-width="0.3" stroke-opacity="0.15"/>
      <circle cx="20" cy="20" r="1.5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="1" fill="#D4AF37" fill-opacity="0.15"/>
      <circle cx="40" cy="0" r="1" fill="#D4AF37" fill-opacity="0.15"/>
      <circle cx="0" cy="40" r="1" fill="#D4AF37" fill-opacity="0.15"/>
      <circle cx="40" cy="40" r="1" fill="#D4AF37" fill-opacity="0.15"/>
    </pattern>

    <!-- Mandala pattern -->
    <pattern id="mandalaPat" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="55" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="60" cy="60" r="45" fill="none" stroke="#D4AF37" stroke-width="0.3" stroke-opacity="0.1"/>
      <circle cx="60" cy="60" r="30" fill="none" stroke="#D4AF37" stroke-width="0.3" stroke-opacity="0.08"/>
      <circle cx="60" cy="60" r="15" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.12"/>
      <!-- Petals -->
      <ellipse cx="60" cy="20" rx="5" ry="12" fill="#D4AF37" fill-opacity="0.06" transform="rotate(0 60 60)"/>
      <ellipse cx="60" cy="20" rx="5" ry="12" fill="#D4AF37" fill-opacity="0.06" transform="rotate(45 60 60)"/>
      <ellipse cx="60" cy="20" rx="5" ry="12" fill="#D4AF37" fill-opacity="0.06" transform="rotate(90 60 60)"/>
      <ellipse cx="60" cy="20" rx="5" ry="12" fill="#D4AF37" fill-opacity="0.06" transform="rotate(135 60 60)"/>
      <ellipse cx="60" cy="20" rx="5" ry="12" fill="#D4AF37" fill-opacity="0.06" transform="rotate(180 60 60)"/>
      <ellipse cx="60" cy="20" rx="5" ry="12" fill="#D4AF37" fill-opacity="0.06" transform="rotate(225 60 60)"/>
      <ellipse cx="60" cy="20" rx="5" ry="12" fill="#D4AF37" fill-opacity="0.06" transform="rotate(270 60 60)"/>
      <ellipse cx="60" cy="20" rx="5" ry="12" fill="#D4AF37" fill-opacity="0.06" transform="rotate(315 60 60)"/>
    </pattern>
  </defs>

  <!-- Main background -->
  <rect width="1440" height="900" fill="url(#bgGrad)"/>

  <!-- Subtle mandala overlay -->
  <rect width="1440" height="900" fill="url(#mandalaPat)"/>

  <!-- Floor tile subtle overlay -->
  <rect y="680" width="1440" height="220" fill="url(#floorTile)" opacity="0.5"/>

  <!-- Central glow behind dancer -->
  <ellipse cx="720" cy="500" rx="500" ry="400" fill="url(#glowGrad)"/>

  <!-- ── Temple Arch (top center) ── -->
  <g opacity="0.5">
    <!-- Main arch outline -->
    <path d="M 520,100 Q 720,-30 920,100 L 920,600 Q 720,650 520,600 Z"
          fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35"/>
    <!-- Inner arch -->
    <path d="M 560,120 Q 720,0 880,120 L 880,580 Q 720,625 560,580 Z"
          fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.2"/>
    <!-- Arch decorative dots -->
    <circle cx="720" cy="5" r="6" fill="#D4AF37" fill-opacity="0.4"/>
    <circle cx="720" cy="5" r="3" fill="#D4AF37" fill-opacity="0.6"/>
    <circle cx="700" cy="10" r="2.5" fill="#D4AF37" fill-opacity="0.3"/>
    <circle cx="740" cy="10" r="2.5" fill="#D4AF37" fill-opacity="0.3"/>
    <circle cx="680" cy="22" r="2" fill="#D4AF37" fill-opacity="0.25"/>
    <circle cx="760" cy="22" r="2" fill="#D4AF37" fill-opacity="0.25"/>
  </g>

  <!-- ── Bharatanatyam Dancer Silhouette (Aramandi pose) ── -->
  <g transform="translate(720, 450)" opacity="0.75">
    <!-- Head with hair bun (mukuta) -->
    <ellipse cx="0" cy="-310" rx="28" ry="32" fill="#8B1A1A" opacity="0.9"/>
    <!-- Hair bun decoration -->
    <ellipse cx="0" cy="-345" rx="12" ry="16" fill="#6B1212" opacity="0.9"/>
    <circle cx="0" cy="-362" r="5" fill="#D4AF37" fill-opacity="0.8"/>
    <!-- Earrings -->
    <circle cx="-30" cy="-305" r="4" fill="#D4AF37" fill-opacity="0.7"/>
    <circle cx="30" cy="-305" r="4" fill="#D4AF37" fill-opacity="0.7"/>

    <!-- Neck and necklace -->
    <rect x="-10" y="-278" width="20" height="22" rx="5" fill="#7A1515" opacity="0.9"/>
    <ellipse cx="0" cy="-275" rx="18" ry="4" fill="#D4AF37" fill-opacity="0.5"/>

    <!-- Upper body in Aramandi -->
    <ellipse cx="0" cy="-230" rx="40" ry="45" fill="#8B1A1A" opacity="0.9"/>

    <!-- Left arm raised (hasta mudra - left) -->
    <path d="M -40,-255 Q -90,-230 -130,-180 Q -150,-155 -145,-140"
          stroke="#8B1A1A" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- Left hand -->
    <ellipse cx="-145" cy="-135" rx="18" ry="12" fill="#8B1A1A" opacity="0.9" transform="rotate(-20 -145 -135)"/>
    <!-- Left hand finger details -->
    <path d="M -158,-128 Q -165,-110 -160,-95" stroke="#6B1212" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -148,-125 Q -152,-105 -147,-90" stroke="#6B1212" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Right arm (hasta mudra - right, raised) -->
    <path d="M 40,-255 Q 90,-230 130,-180 Q 150,-155 145,-140"
          stroke="#8B1A1A" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- Right hand -->
    <ellipse cx="145" cy="-135" rx="18" ry="12" fill="#8B1A1A" opacity="0.9" transform="rotate(20 145 -135)"/>
    <!-- Right hand finger details -->
    <path d="M 158,-128 Q 165,-110 160,-95" stroke="#6B1212" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 148,-125 Q 152,-105 147,-90" stroke="#6B1212" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Waist / skirt top -->
    <ellipse cx="0" cy="-185" rx="45" ry="12" fill="#D4AF37" fill-opacity="0.5"/>

    <!-- Aramandi stance - wide skirt/dhavani -->
    <path d="M -45,-185 Q -120,-100 -140,0 L 140,0 Q 120,-100 45,-185 Z"
          fill="#8B1A1A" opacity="0.85"/>

    <!-- Skirt pleats -->
    <line x1="-20" y1="-185" x2="-40" y2="0" stroke="#6B1212" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="0" y1="-185" x2="0" y2="0" stroke="#6B1212" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="20" y1="-185" x2="40" y2="0" stroke="#6B1212" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Front fan -->
    <path d="M -25,-150 Q 0,-130 25,-150 L 35,-50 Q 0,-30 -35,-50 Z"
          fill="#D4AF37" fill-opacity="0.25"/>

    <!-- Legs in Aramandi (half-sitting wide stance) -->
    <!-- Left leg -->
    <path d="M -85,0 Q -110,60 -120,120 Q -115,160 -105,180"
          stroke="#8B1A1A" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- Left foot -->
    <ellipse cx="-103" cy="188" rx="22" ry="10" fill="#8B1A1A" opacity="0.9" transform="rotate(-15 -103 188)"/>
    <!-- Left ankle ornament -->
    <ellipse cx="-108" cy="178" rx="14" ry="5" fill="#D4AF37" fill-opacity="0.5"/>

    <!-- Right leg -->
    <path d="M 85,0 Q 110,60 120,120 Q 115,160 105,180"
          stroke="#8B1A1A" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- Right foot -->
    <ellipse cx="103" cy="188" rx="22" ry="10" fill="#8B1A1A" opacity="0.9" transform="rotate(15 103 188)"/>
    <!-- Right ankle ornament -->
    <ellipse cx="108" cy="178" rx="14" ry="5" fill="#D4AF37" fill-opacity="0.5"/>

    <!-- Gold jewelry highlights -->
    <!-- Headpiece -->
    <path d="M -20,-342 Q 0,-355 20,-342" stroke="#D4AF37" stroke-width="3" fill="none" stroke-opacity="0.8"/>
    <!-- Armlets -->
    <ellipse cx="-85" cy="-220" rx="14" ry="5" fill="#D4AF37" fill-opacity="0.5" transform="rotate(-30 -85 -220)"/>
    <ellipse cx="85" cy="-220" rx="14" ry="5" fill="#D4AF37" fill-opacity="0.5" transform="rotate(30 85 -220)"/>
    <!-- Waist belt -->
    <path d="M -45,-185 Q 0,-195 45,-185" stroke="#D4AF37" stroke-width="3" fill="none" stroke-opacity="0.6"/>

    <!-- Shadow on ground -->
    <ellipse cx="0" cy="210" rx="120" ry="15" fill="#000000" fill-opacity="0.3"/>
  </g>

  <!-- ── Decorative Border – Top ── -->
  <g opacity="0.4">
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#D4AF37" stroke-width="3"/>
    <line x1="0" y1="8" x2="1440" y2="8" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5"/>
    <!-- Top border gems -->
    <g fill="#D4AF37">
      <rect x="140" y="0" width="8" height="8" transform="rotate(45 144 4)" fill-opacity="0.6"/>
      <rect x="280" y="0" width="8" height="8" transform="rotate(45 284 4)" fill-opacity="0.6"/>
      <rect x="420" y="0" width="8" height="8" transform="rotate(45 424 4)" fill-opacity="0.6"/>
      <rect x="560" y="0" width="8" height="8" transform="rotate(45 564 4)" fill-opacity="0.6"/>
      <rect x="700" y="0" width="8" height="8" transform="rotate(45 704 4)" fill-opacity="0.8"/>
      <rect x="840" y="0" width="8" height="8" transform="rotate(45 844 4)" fill-opacity="0.6"/>
      <rect x="980" y="0" width="8" height="8" transform="rotate(45 984 4)" fill-opacity="0.6"/>
      <rect x="1120" y="0" width="8" height="8" transform="rotate(45 1124 4)" fill-opacity="0.6"/>
      <rect x="1260" y="0" width="8" height="8" transform="rotate(45 1264 4)" fill-opacity="0.6"/>
    </g>
  </g>

  <!-- ── Decorative Border – Bottom ── -->
  <g opacity="0.4">
    <line x1="0" y1="900" x2="1440" y2="900" stroke="#D4AF37" stroke-width="3"/>
    <line x1="0" y1="892" x2="1440" y2="892" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5"/>
    <g fill="#D4AF37">
      <rect x="140" y="892" width="8" height="8" transform="rotate(45 144 896)" fill-opacity="0.6"/>
      <rect x="280" y="892" width="8" height="8" transform="rotate(45 284 896)" fill-opacity="0.6"/>
      <rect x="420" y="892" width="8" height="8" transform="rotate(45 424 896)" fill-opacity="0.6"/>
      <rect x="560" y="892" width="8" height="8" transform="rotate(45 564 896)" fill-opacity="0.6"/>
      <rect x="700" y="892" width="8" height="8" transform="rotate(45 704 896)" fill-opacity="0.8"/>
      <rect x="840" y="892" width="8" height="8" transform="rotate(45 844 896)" fill-opacity="0.6"/>
      <rect x="980" y="892" width="8" height="8" transform="rotate(45 984 896)" fill-opacity="0.6"/>
      <rect x="1120" y="892" width="8" height="8" transform="rotate(45 1124 896)" fill-opacity="0.6"/>
      <rect x="1260" y="892" width="8" height="8" transform="rotate(45 1264 896)" fill-opacity="0.6"/>
    </g>
  </g>

  <!-- ── Left Side Decorative Column ── -->
  <g transform="translate(80, 0)" opacity="0.35">
    <line x1="0" y1="0" x2="0" y2="900" stroke="#D4AF37" stroke-width="2"/>
    <!-- Lotus motifs along left column -->
    <g transform="translate(0, 150)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#D4AF37" fill-opacity="0.3"/>
      <ellipse cx="0" cy="-12" rx="12" ry="7" fill="#D4AF37" fill-opacity="0.25"/>
      <ellipse cx="0" cy="-22" rx="7" ry="5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="-28" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(0, 350)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#D4AF37" fill-opacity="0.3"/>
      <ellipse cx="0" cy="-12" rx="12" ry="7" fill="#D4AF37" fill-opacity="0.25"/>
      <ellipse cx="0" cy="-22" rx="7" ry="5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="-28" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(0, 550)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#D4AF37" fill-opacity="0.3"/>
      <ellipse cx="0" cy="-12" rx="12" ry="7" fill="#D4AF37" fill-opacity="0.25"/>
      <ellipse cx="0" cy="-22" rx="7" ry="5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="-28" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(0, 750)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#D4AF37" fill-opacity="0.3"/>
      <ellipse cx="0" cy="-12" rx="12" ry="7" fill="#D4AF37" fill-opacity="0.25"/>
      <ellipse cx="0" cy="-22" rx="7" ry="5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="-28" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- ── Right Side Decorative Column ── -->
  <g transform="translate(1360, 0)" opacity="0.35">
    <line x1="0" y1="0" x2="0" y2="900" stroke="#D4AF37" stroke-width="2"/>
    <g transform="translate(0, 150)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#D4AF37" fill-opacity="0.3"/>
      <ellipse cx="0" cy="-12" rx="12" ry="7" fill="#D4AF37" fill-opacity="0.25"/>
      <ellipse cx="0" cy="-22" rx="7" ry="5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="-28" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(0, 350)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#D4AF37" fill-opacity="0.3"/>
      <ellipse cx="0" cy="-12" rx="12" ry="7" fill="#D4AF37" fill-opacity="0.25"/>
      <ellipse cx="0" cy="-22" rx="7" ry="5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="-28" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(0, 550)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#D4AF37" fill-opacity="0.3"/>
      <ellipse cx="0" cy="-12" rx="12" ry="7" fill="#D4AF37" fill-opacity="0.25"/>
      <ellipse cx="0" cy="-22" rx="7" ry="5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="-28" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(0, 750)">
      <ellipse cx="0" cy="0" rx="18" ry="8" fill="#D4AF37" fill-opacity="0.3"/>
      <ellipse cx="0" cy="-12" rx="12" ry="7" fill="#D4AF37" fill-opacity="0.25"/>
      <ellipse cx="0" cy="-22" rx="7" ry="5" fill="#D4AF37" fill-opacity="0.2"/>
      <circle cx="0" cy="-28" r="3" fill="#D4AF37" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- ── Left Oil Lamp (Kuthuvilakku) ── -->
  <g transform="translate(260, 680)" opacity="0.7">
    <!-- Lamp glow -->
    <circle cx="0" cy="-80" r="60" fill="url(#lampGlow)" opacity="0.7"/>
    <!-- Lamp stand -->
    <polygon points="-4,0 4,0 6,-60 -6,-60" fill="#D4AF37" fill-opacity="0.7"/>
    <!-- Lamp bowl -->
    <ellipse cx="0" cy="-60" rx="20" ry="8" fill="#D4AF37" fill-opacity="0.7"/>
    <!-- Lamp oil -->
    <ellipse cx="0" cy="-62" rx="16" ry="5" fill="#B8960C" fill-opacity="0.5"/>
    <!-- Flame -->
    <path d="M 0,-68 Q -6,-80 0,-95 Q 6,-80 0,-68 Z" fill="#FFD700" opacity="0.9"/>
    <path d="M 0,-72 Q -3,-80 0,-90 Q 3,-80 0,-72 Z" fill="#FFFFFF" opacity="0.8"/>
    <!-- Base -->
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#D4AF37" fill-opacity="0.7"/>
    <rect x="-6" y="-15" width="12" height="15" rx="2" fill="#D4AF37" fill-opacity="0.6"/>
  </g>

  <!-- ── Right Oil Lamp (Kuthuvilakku) ── -->
  <g transform="translate(1180, 680)" opacity="0.7">
    <!-- Lamp glow -->
    <circle cx="0" cy="-80" r="60" fill="url(#lampGlow)" opacity="0.7"/>
    <!-- Lamp stand -->
    <polygon points="-4,0 4,0 6,-60 -6,-60" fill="#D4AF37" fill-opacity="0.7"/>
    <!-- Lamp bowl -->
    <ellipse cx="0" cy="-60" rx="20" ry="8" fill="#D4AF37" fill-opacity="0.7"/>
    <!-- Lamp oil -->
    <ellipse cx="0" cy="-62" rx="16" ry="5" fill="#B8960C" fill-opacity="0.5"/>
    <!-- Flame -->
    <path d="M 0,-68 Q -6,-80 0,-95 Q 6,-80 0,-68 Z" fill="#FFD700" opacity="0.9"/>
    <path d="M 0,-72 Q -3,-80 0,-90 Q 3,-80 0,-72 Z" fill="#FFFFFF" opacity="0.8"/>
    <!-- Base -->
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#D4AF37" fill-opacity="0.7"/>
    <rect x="-6" y="-15" width="12" height="15" rx="2" fill="#D4AF37" fill-opacity="0.6"/>
  </g>

  <!-- ── Stage floor line ── -->
  <line x1="0" y1="840" x2="1440" y2="840" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="0" y1="845" x2="1440" y2="845" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- ── Scattered Lotus Petals ── -->
  <g fill="#8B1A1A" opacity="0.25">
    <ellipse cx="200" cy="750" rx="15" ry="6" transform="rotate(-20 200 750)"/>
    <ellipse cx="350" cy="800" rx="12" ry="5" transform="rotate(15 350 800)"/>
    <ellipse cx="500" cy="770" rx="10" ry="4" transform="rotate(-10 500 770)"/>
    <ellipse cx="900" cy="780" rx="12" ry="5" transform="rotate(25 900 780)"/>
    <ellipse cx="1050" cy="755" rx="14" ry="6" transform="rotate(-18 1050 755)"/>
    <ellipse cx="1200" cy="810" rx="11" ry="5" transform="rotate(12 1200 810)"/>
  </g>

  <!-- ── Decorative corner elements ── -->
  <!-- Top Left Corner -->
  <g transform="translate(20, 20)" opacity="0.35" fill="none" stroke="#D4AF37">
    <path d="M 0,80 L 0,0 L 80,0" stroke-width="2"/>
    <path d="M 0,60 L 0,15 L 60,15" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#D4AF37" fill-opacity="0.5" stroke="none"/>
  </g>
  <!-- Top Right Corner -->
  <g transform="translate(1420, 20)" opacity="0.35" fill="none" stroke="#D4AF37">
    <path d="M 0,80 L 0,0 L -80,0" stroke-width="2"/>
    <path d="M 0,60 L 0,15 L -60,15" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#D4AF37" fill-opacity="0.5" stroke="none"/>
  </g>
  <!-- Bottom Left Corner -->
  <g transform="translate(20, 880)" opacity="0.35" fill="none" stroke="#D4AF37">
    <path d="M 0,-80 L 0,0 L 80,0" stroke-width="2"/>
    <path d="M 0,-60 L 0,-15 L 60,-15" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#D4AF37" fill-opacity="0.5" stroke="none"/>
  </g>
  <!-- Bottom Right Corner -->
  <g transform="translate(1420, 880)" opacity="0.35" fill="none" stroke="#D4AF37">
    <path d="M 0,-80 L 0,0 L -80,0" stroke-width="2"/>
    <path d="M 0,-60 L 0,-15 L -60,-15" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#D4AF37" fill-opacity="0.5" stroke="none"/>
  </g>
</svg>
