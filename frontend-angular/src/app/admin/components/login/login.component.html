<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--color-dark);padding:2rem">
  <div style="background:var(--color-white);padding:3rem;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:400px">
    <div style="text-align:center;margin-bottom:2rem">
      <div class="logo-circle" style="margin:0 auto 1rem"><span class="initials">NT</span></div>
      <h2 style="color:var(--color-primary)">Admin Login</h2>
    </div>
    <div *ngIf="error" class="alert alert-error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label>Username</label>
        <input formControlName="username" type="text" placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
